<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c1d"><title>전선: 동아시아</title><link rel="stylesheet" href="style.css"></head><body>
<div id="start" class="modal"><div class="card"><div class="eyebrow">STRATEGIC COMMAND · PROTOTYPE 01</div><h1>전선<span>:</span> 동아시아</h1><p class="lead">국가를 선택하고 전선을 지휘하세요.</p><p>가상의 현대전 시나리오입니다. 상대 수도를 점령하면 승리합니다.</p><button id="continue" class="continue" hidden>이어하기</button><p id="save-info" class="muted" aria-live="polite"></p><div class="choices"><button data-country="south"><strong>대한민국</strong><small>서울 방어 · 평양 확보</small></button><button data-country="north"><strong>북한</strong><small>평양 방어 · 서울 확보</small></button></div><p class="muted">시제품 · 지도와 병력 수치는 게임을 위해 단순화했습니다.</p></div></div>
<div id="game" hidden><header><div class="brand"><span class="brandmark">✦</span><div><b>전선: 동아시아</b><small>가상 현대전 시나리오</small></div></div><div class="stats"><div><small>날짜</small><b id="date"></b></div><div><small>보급품</small><b id="supply"></b></div><div><small>보병 / 전차 장비</small><b id="equipment"></b></div></div><div class="time"><button id="save">저장</button><button id="pause">▶ 진행</button><button id="speed">1×</button></div></header>
<main><div class="mission"><span class="live"></span><span id="objective"></span><button id="help">도움말 ?</button></div><div class="map-wrap"><svg id="map" viewBox="0 0 1000 600" role="img" aria-label="한반도 주변 가상 전략 지도"><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#a8c4b1" stroke-opacity=".09"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".4"/></filter></defs><rect width="1000" height="600" fill="#233d42"/><rect width="1000" height="600" fill="url(#grid)"/><path d="M0 0H300L345 80 320 150 290 190 205 215 170 300 0 330Z" fill="#52614c" opacity=".7"/><path d="M780 380l55 -58 32 12 -38 60 -20 63 -40 31 -14 -20z M856 240l44 -33 14 18 -25 42 -32 16z" fill="#586e60" stroke="#82988a" stroke-width="2"/><text x="85" y="360" class="sea">서 해</text><text x="835" y="170" class="sea">동 해</text><g id="regions"></g><g id="orders" aria-hidden="true"></g><g id="units"></g></svg><div class="zoom-controls" aria-label="지도 확대"><button id="zoom-in" aria-label="확대">+</button><button id="zoom-out" aria-label="축소">−</button><button id="zoom-reset" aria-label="지도 초기화">⌂</button></div><div class="mapkey"><span><i class="blue"></i> 아군</span><span><i class="red"></i> 적군</span><span>★ 수도</span><span class="battle-key">✦ 전투</span><span class="front-key">┄ 전선</span></div><div class="maphint">지역을 눌러 부대를 선택하세요</div></div><aside id="panel"><div class="panel-head"><div><small>작전 현황</small><h2 id="panel-title">지휘 본부</h2></div><button id="close" aria-label="패널 닫기">×</button></div><div id="panel-body"></div></aside></main>
<footer><button data-tab="army" class="active"><span>▣</span>부대</button><button data-tab="production"><span>⚙</span>생산</button><button data-tab="front"><span>⌁</span>전선</button><button data-tab="research"><span>◇</span>연구</button><button data-tab="plan"><span>✦</span>계획</button><button data-tab="log"><span>≡</span>상황판</button><div class="footer-note">COMMAND / EAST ASIA <b>01</b></div></footer><div id="toast" role="status"></div></div>
<div id="end" class="modal" hidden><div class="card endcard"><div class="eyebrow">OPERATION REPORT</div><h1 id="end-title"></h1><p id="end-text"></p><button id="restart" class="primary">다시 시작</button></div></div><script src="game.js"></script></body></html>
